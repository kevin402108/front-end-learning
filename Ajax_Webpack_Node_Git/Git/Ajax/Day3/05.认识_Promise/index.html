<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>认识Promise</title>
</head>

<body>
  <script>
    /**
     * 目标：使用Promise管理异步任务
    */
    //创建Promise对象
    const p = new Promise((resolve,reject)=>{
      //执行异步任务
      setTimeout(()=>{
        // resolve('请求成功')
        reject(new Error('请求失败'))
      },2000)
    })

    p.then(result=>{
      console.log(result)
    }).catch(error=>{
      console.log(error)
    })
  </script>
</body>

</html>
