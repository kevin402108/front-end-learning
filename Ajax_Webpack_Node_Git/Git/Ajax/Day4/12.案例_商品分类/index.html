<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>案例_分类导航</title>
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <!-- 大容器 -->
  <div class="container">
    <div class="sub-list">
      <div class="item">
        <h3>分类名字</h3>
        <ul>
          <li>
            <a href="javascript:;">
              <img src="" />
              <p>巧克力</p>
            </a>
          </li>
          <li>
            <a href="javascript:;">
              <img src="" />
              <p>巧克力</p>
            </a>
          </li>
          <li>
            <a href="javascript:;">
              <img src="" />
              <p>巧克力</p>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    /**
     *  1. 获取所有一级分类数据
     *  2. 遍历id，创建获取二级分类请求
     *  3. 合并所有二级分类Promise对象
     *  4. 等待同时成功后，渲染页面
    */
    //获取一级分类
    axios({
      url:'http://hmajax.itheima.net/api/category/top'
    }).then(result=>{
      const tcArr = result.data.data
      //遍历一级分类id，创建包含所有所需的二级分类请求的数组(此时不会发起请求！！！)
      const secondPromiseList = tcArr.map(elem=>axios({
        url:'http://hmajax.itheima.net/api/category/sub',
        params:{id:elem.id}
      }))
      //合并二级分类请求，同时发起所有请求
      const p = Promise.all(secondPromiseList)
      p.then(result=>{
        // console.log(result)
        const htmlStr = result.map(elem=>{
          const {name,children} = elem.data.data
          return `
          <div class="item">
            <h3>${name}</h3>
            <ul>
              ${children.map(item=>`
                  <li>
                    <a href="javascript:;">
                      <img src=${item.picture}>
                      <p>${item.name}</p>
                    </a>
                  </li>
                `).join('')}
              </ul>
          </div>
        `
      }).join('')
        document.querySelector('.sub-list').innerHTML = htmlStr
      }).catch(error=>{
        console.log(error)
      })
    }).catch(error=>{
      console.dir(error)
    })
  </script>
</body>

</html>
