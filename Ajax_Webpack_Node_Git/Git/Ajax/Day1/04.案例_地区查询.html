<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>04.案例_地区查询</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            font-size: 15px;
        }

        body {
            padding-top: 15px;
        }
    </style>
</head>

<body>
<div class="container">
    <form class="row" id="editForm">
        <!-- 输入省份名字 -->
        <div class="mb-3 col">
            <label class="form-label">省份名字</label>
            <input class="form-control province" name="province" placeholder="请输入省份名称" type="text" value=""/>
        </div>
        <!-- 输入城市名字 -->
        <div class="mb-3 col">
            <label class="form-label">城市名字</label>
            <input class="form-control city" name="city" placeholder="请输入城市名称" type="text" value=""/>
        </div>
    </form>
    <button class="btn btn-primary sel-btn" type="button">查询</button>
    <br><br>
    <p>地区列表: </p>
    <ul class="list-group">
        <!-- 示例地区 -->
        <li class="list-group-item"></li>
    </ul>
</div>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    /*
      获取地区列表: http://hmajax.itheima.net/api/area
      查询参数:
        pname: 省份或直辖市名字
        cname: 城市名字
    */
    document.querySelector('.sel-btn').addEventListener('click', () => {
        const pname = document.querySelector('[name=province]').value
        const cname = document.querySelector('[name=city]').value
        axios({
            url: 'http://hmajax.itheima.net/api/area',
            params: {
                pname,
                cname
            }
        }).then(result => {
            // console.log(result)
            const areas = result.data.list
            const li =areas.map(elem => `<li class="list-group-item">${elem}</li>`).join('')
            document.querySelector('.list-group').innerHTML = li;
        })
    })
</script>
</body>

</html>
