<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03.查询参数</title>
</head>
<body>
  <p class="my-p"></p>
  <!-- 
    城市列表: http://hmajax.itheima.net/api/city
    参数名: pname
    值: 省份名字
  -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
      axios({
        url:'http://hmajax.itheima.net/api/city',
        //查询参数
        params:{
          pname:'广东省'
        }
      }).then(result=>{
        const cityList=result.data.list.map((ele,index)=>`${index+1}.${ele}`).join('<br>');
        document.querySelector('.my-p').innerHTML = cityList;
      })
  </script>
</body>
</html>
