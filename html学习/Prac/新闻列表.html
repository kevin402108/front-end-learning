<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻列表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        li {
            list-style: none;
        }

        a {
            text-decoration: none;
        }

        .newslist {
            width: 360px;
            height: 200px;
            margin:50px auto;
            background-color:bisque;

            .head {
                height: 34px;
                background-color: #eee;
                border: 1px solid #dbdee1;
                border-left: 0;
                a {
                    margin-top: -1px;
                    display: block;
                    background-color: #fff;
                    height: 34px;
                    width: 48px;
                    border-top: 3px solid #ff8400;
                    border-right: 1px solid #dbdee1;

                    color: #333;
                    font-size: 14px;
                    text-align: center;
                    line-height: 32px;
                }

                a:hover {
                    color:#ffa500;
                }
            }

            .body {
                padding: 5px;
                li {
                    padding-left: 15px;
                    background-image: url(../images/square.png);
                    background-repeat: no-repeat;
                    background-position: 0 center;
                    a {
                        padding-left: 20px;
                        background-image: url(../images/img.gif);
                        background-repeat: no-repeat;
                        background-position: 0 center;

                        color:#666;
                        font-size: 12px;
                        line-height: 24px;
                    }

                    a:hover {
                    color:#ffa500;
                    }                    
                }
        }
    }
    </style>
</head>
<body>
    <div class="newslist">
        <div class="head"><a href="#">新闻</a></div>
        <div class="body">
            <ul>
                <li><a href="#">点赞“新农人” 温暖的伸手</a></li>
                <li><a href="#">在希望的田野上...</a></li>
                <li><a href="#">“中国天眼”又有新发现 已在《自然》杂志发表</a></li>
                <li><a href="#">急！这个领域，缺人！月薪4万元还不好招！啥情况？</a></li>
                <li><a href="#">G9“带货”背后：亏损面持续扩大，竞争环境激烈</a></li>
                <li><a href="#">多地力推二手房“带押过户”，有什么好处？</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
