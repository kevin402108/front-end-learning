<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滚动效果示例</title>
<style>
    /* 容器样式 */
    .scroll-container {
        width: 200px;          /* 设置容器的宽度 */
        height: 400px;         /* 设置容器的高度 */
        background-color: #2d70bc;
        overflow-y: auto;      /* 启用垂直滚动 */
    }

    /* 链接样式 */
    .item {
        display: block;             /* 使链接占据整行 */
        padding: 20px;
        text-align: center;
        color: white;
        font-size: 18px;
        text-decoration: none;      /* 去掉下划线 */
        background-color: #3b78d8;
        border-bottom: 1px solid #2d70bc;
    }

    .item:hover {
        background-color: #5a9bd3;   /* 鼠标悬停时改变背景色 */
    }

    .item:first-child {
        background-color: #6699cc;   /* 第一个项目的背景色不同 */
    }
</style>
</head>
<body>

<div class="scroll-container">
    <a href="#" class="item">HTML</a>
    <a href="#" class="item">CSS</a>
    <a href="#" class="item">JavaScript</a>
    <a href="#" class="item">Vue</a>
    <a href="#" class="item">React</a>
    <a href="#" class="item">JSON</a>
    <a href="#" class="item">微信小程序</a>
    <a href="#" class="item">C/C++</a>
    <a href="#" class="item">Java</a>
    <a href="#" class="item">Python</a>
</div>

</body>
</html>
