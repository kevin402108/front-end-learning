<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        li {
            list-style: none;
        }

        /* 单伪元素法 */
        .clearfix::after {
            content: "";
            display: block;
            clear: both;
        }
        /* 双伪元素法 */
        .clearfix::before,
        .clearfix::after {
            content:"";
            display: table;
        }
        .clearfix::after {
            clear: both;
        }
        
        .product {
            overflow: hidden;
            margin: 50px auto;
            width: 1226px;
            /* height: 628px; */
            background-color:blanchedalmond;

            .banner {
                float: left;
                width: 234px;
                height: 628px;
                background-color: skyblue;

            }

            .goods {
                float: right;
                width: 978px;
                height: 628px;
                background-color: orange;

                li {
                    float: left;
                    margin-right: 14px;
                    margin-bottom: 14px;
                    width: 234px;
                    height: 300px;
                    background-color: skyblue;
                }

                li:nth-child(4n) {
                    margin-right: 0;
                }
            }
        }

        .red {
            height: 100px;
            margin: 20px;
            background-color: red;
        }
    </style>
</head>

<body>
    <div class="product clearfix">
        <div class="banner"></div>
        <div class="goods">
            <ul>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
            </ul>
        </div>
    </div>
    <div class="red"></div>
</body>

</html>
