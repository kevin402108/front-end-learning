<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一行布局示例</title>
<style>
    /* 父容器：横向排列子项 */
    .container {
        display: flex;
    }

    /* 左侧菜单样式 */
    .menu {
        width: 200px;
        background-color: #2d70bc;
        overflow-y: auto;
        padding: 10px;
    }

    .menu a {
        display: block;
        padding: 15px;
        text-align: center;
        color: white;
        font-size: 16px;
        text-decoration: none;
        background-color: #3b78d8;
        border-bottom: 1px solid #2d70bc;
    }

    .menu a:hover {
        background-color: #5a9bd3;
    }

    /* 右侧内容区域样式 */
    .content {
        flex: 1;
        padding: 10px;
    }

    .content img {
        width: 30%;
        margin-right: 10px;
        vertical-align: middle;
    }
</style>
</head>
<body>

<div class="container">
    <!-- 左侧菜单 -->
    <div class="menu">
        <a href="#">HTML</a>
        <a href="#">CSS</a>
        <a href="#">JavaScript</a>
        <a href="#">Vue</a>
        <a href="#">React</a>
        <a href="#">微信小程序</a>
        <a href="#">C/C++</a>
        <a href="#">Java</a>
        <a href="#">Python</a>
        <a href="#">PHP</a>
        <a href="#">SQL</a>
        <a href="#">Markdown</a>
    </div>

    <!-- 右侧内容区域 -->
    <div class="content">
        <img src="../images/1.jpg" alt="示例图片1">
        <img src="../images/2.jpg" alt="示例图片2">
        <img src="../images/3.jpg" alt="示例图片3">
    </div>
</div>

</body>
</html>
