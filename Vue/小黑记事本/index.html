<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="./css/index.css" />
<title>记事本</title>
</head>
<body>

<!-- 主体区域 -->
<section id="app">
  <!-- 输入框 -->
  <header class="header">
    <h1>小黑记事本</h1>
    <input placeholder="请输入任务" class="new-todo" v-model.trim="taskName" @keyup.enter="add"/>
    <button class="add" @click="add" >添加任务</button>
  </header>
  <!-- 列表区域 -->
  <section class="main">
    <ul class="todo-list">
      <li class="todo" v-for="(item,index) in todoLists" :key="item.id">
        <div class="view">
          <span class="index">{{index+1}}.</span> <label>{{item.name}}</label>
          <button class="destroy" @click="del(item.id)"></button>
        </div>
      </li>
    </ul>
  </section>
  <!-- 统计和清空 -->
  <footer class="footer" v-show="todoLists.length !== 0">
    <!-- 统计 -->
    <span class="todo-count">合 计:<strong>{{todoLists.length}}</strong></span>
    <!-- 清空 -->
    <button class="clear-completed" @click="clear">
      清空任务
    </button>
  </footer>
</section>

<script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
<script>

  const app = new Vue({
    el: '#app',
    data: {
      todoLists:[],
      taskName:'',
    },
    methods:{
      add() {
        if(!this.taskName) {
          alert('任务不能为空！')
          this.taskName=''
          return
        }
        this.todoLists.unshift({
          id:+new Date(),
          name:this.taskName
        })
        this.taskName=''
      },

      del(id) {
        this.todoLists = this.todoLists.filter(item=>item.id !== id)
      },

      clear() {
        this.todoLists = []
      }
    }
  })

</script>
</body>
</html>
