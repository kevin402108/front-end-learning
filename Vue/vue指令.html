<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li {
            list-style: none;
        }

        .box {
            margin-top: 10px;
            padding: 10px 20px 0;
            width: 200px;
            height: 100px;
            border: 3px solid #000;
            border-radius: 10px;
        }

        .pink {
            background-color: pink;
        }

        .big {
            width: 300px;
            height: 300px;
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- v-html (相当于innerHTML)-->
        <div v-html="msg" @click.prevent></div>
        <!-- v-show 控制当前元素CSS的display属性-->
        <div v-show="flag" style="border: 1px solid #000;margin-bottom: 10px;">I am controlled by v-show</div>
        <!-- v-if 控制当前元素的创建和删除-->
        <div v-if="flag" style="border: 1px solid #000;">I am controlled by v-if</div>
        <!-- v-else v-else-if -->
        <div v-if="gender === '男'">性别：男</div>
        <div v-else>性别：女</div>

        <!--    <div v-if="score >= 90 && score <= 100">成绩:A</div>
        <div v-else-if="score >= 70 && score < 90">成绩:B</div>
        <div v-else-if="score >= 60 && score < 70">成绩:C</div>
        <div v-else-if ="score < 60 && score >= 0">成绩:F</div>
        <div v-else>成绩必须在0~100之间！</div> -->

        <!-- v-on -->
        <button class="dec" v-show="true" @click="numDecrease(count++,count--)">-</button>
        <span>{{count}}</span>
        <button @click="numIncrease(count++,count--)">+</button>
        <div class="box" :class="{pink:true,big:false}">
            <h3>小黑自动售货机</h3>
            <button @click="buy(5)">可乐5元</button>
            <button @click="buy(10)">咖啡10元</button>
        </div>
        <p>银行卡余额：{{money}}元</p>
        <div class="box" :class="['pink']" :style="{width:'400px',height:'200px',backgroundColor:'green'}">
            <h3>小黑自动售货机</h3>
            <button @click="buy(5)">可乐5元</button>
            <button @click="buy(10)">咖啡10元</button>
        </div>
        <p>银行卡余额：{{money}}元</p>
        <!-- v-bind:html标签所包含的属性 -->
        <img :src="imgURL" :title="title" alt="">
        <!-- v-for -->
         <p>连环画</p>
         <ul style="display: flex;">
            <li v-for="item in list" style="width: 150px;margin-right: 20px;"><img :src="item" alt=""></li>
         </ul>
         <!-- v-model -->
          <label for="">账户 <input type="text" v-model="username"></label><br>
          <label for="">密码 <input type="password" v-model="password"></label><br>
          <button @click="login">登录</button>
          <button @click="reset">重置</button><br>
          <!-- 修饰符 -->
           <label class="" for="">
            年龄：<input type="text" v-model.number="age">
           </label>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script>
        const app = new Vue({
            el: "#app",
            data: {
                msg: `
                    <a href="http://www.baidu.com">百度</a>
                    <h3>Hello,Vue!</h3>
                `,
                flag: false,
                gender: '男',
                score: 87,
                count: 1,
                money:100,
                imgURL:'./imgs/10-02.png',
                title:"波仔",
                list:[
                    './imgs/11-00.gif',
                    './imgs/11-01.gif',
                    './imgs/11-02.gif',
                    './imgs/11-03.gif',
                    './imgs/11-04.png',
                    './imgs/11-05.png',
                ],
                username:'',
                password:'',
                age:''
            },
            methods: {
                numDecrease(a,b) {
                    if (this.count === 1) {
                        document.querySelector('.dec').style.disabled = "true"
                    } else {
                        document.querySelector('.dec').style.disabled = "false"
                        this.count--
                    }
                    console.log(a+b);
                },

                numIncrease(a,b) {
                    this.count++;
                    console.log(a+b);
                    
                },

                buy(price) {
                    if(this.money < price){
                        alert('余额不足！')
                        return
                    }
                    this.money -= price;
                },

                login() {
                    console.log(this.username,this.password)
                },

                reset() {
                    this.username=''
                    this.password=''
                }
            }
        })
    </script>
</body>

</html>
