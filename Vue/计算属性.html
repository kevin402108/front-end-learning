<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    table {
      border: 1px solid #000;
      text-align: center;
      width: 240px;
      border-collapse: collapse;
    }
    th,td {
      border: 1px solid #000;
    }
    h3 {
      position: relative;
    }
    span {
      position: absolute;
      left: 145px;
      top: -4px;
      width: 16px;
      height: 16px;
      color: white;
      font-size: 12px;
      text-align: center;
      border-radius: 50%;
      background-color: #e63f32;
    }
  </style>
</head>
<body>

  <div id="app">
    <h3>小黑的礼物清单🛒<span>{{totalNum}}</span></h3>
    <table>
      <tr>
        <th>名字</th>
        <th>数量</th>
      </tr>
      <tr v-for="(item, index) in list" :key="item.id">
        <td>{{ item.name }}</td>
        <td>{{ item.num }}个</td>
      </tr>
    </table>

    <!-- 目标：统计求和，求得礼物总数 -->
    <p>礼物总数：{{totalNum}} 个</p>
    姓：<input type="text" v-model="firstName"><br>
    名：<input type="text" v-model="lastName"><br>
    <p>姓名：{{fullName}}</p>
    <button @click="changeName">修改姓名</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <script>
    const app = new Vue({
      el: '#app',
      data: {
        // 现有的数据
        list: [
          { id: 1, name: '篮球', num: 3 },
          { id: 2, name: '玩具', num: 5 },
          { id: 3, name: '铅笔', num: 5 },
        ],
        firstName:'',
        lastName:'',
      },
      methods:{
        /* totalNum() {
          console.log('计算属性')
          let total = this.list.reduce((sum,item)=>sum+item.num,0)
          return total
        } */
       changeName() {
        this.fullName = '陳奎睿'
       } 
      },
      computed:{
        //简便写法
        totalNum() {
          console.log('计算属性')
          let total = this.list.reduce((sum,item)=>sum+item.num,0)
          return total
        },
        //完整写法(当需要对计算属性的值进行修改或依赖其进行操作 可采用此方法)
        fullName:{
          get() {
            return this.firstName+this.lastName
          },
          set(value) {
            this.firstName = value.slice(0,1)
            this.lastName = value.slice(1,)
          }
        }
      },
    }
  )
  </script>
</body>
</html>
