<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

    <div id="app">
        <h1>{{msg}},{{nickname.toUpperCase()+'!'}}
        </br>欢迎学习VUE2'!</h1>
        <a href="#">{{count}}</a>
        <p>{{age>18?'成年':'未成年'}}</p>
        <p>{{friend.name + ':' + friend.age}}</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script>
        const app = new Vue({
            el: '#app',
            data: {
                msg: 'HELLO',
                count: 666,
                nickname:'kevin',
                age:20,
                friend:{
                    name:'Alex',
                    age:21
                },
            }
        })
    </script>
</body>

</html>
