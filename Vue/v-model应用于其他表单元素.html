<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    textarea {
      display: block;
      width: 240px;
      height: 100px;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <div id="app">
    <h3>小黑学习网</h3>

    姓名：
      <input type="text" v-model="username"> 
      <br><br>

    <!-- 复选框：设置v-model，与之绑定的接受变量的值只能为false或true -->
    是否单身：
      <input type="checkbox" v-model="isSingle"> 
      <br><br>
    <!-- 单选框：多个需绑定相同的name和不同的value,并设置v-model，绑定对应的接受变量 -->
    性别: 
      <input v-model="gender" type="radio" name="gender" value="0">男
      <input v-model="gender" type="radio" name="gender" value="1">女
      <br><br>

    <!-- 下拉框：每个option设置value属性，并且在select中设置v-model，绑定对应的接受变量 -->
    所在城市:
      <select v-model="cityId">
        <option value="101">北京</option>
        <option value="102">上海</option>
        <option value="103">成都</option>
        <option value="104">南京</option>
        <option value="105">深圳</option>
      </select>
      <br><br>

    自我描述：
      <textarea v-model="description"></textarea> 

    <button>立即注册</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <script>
    const app = new Vue({
      el: '#app',
      data: {
        username:'',
        isSingle:false,
        gender:'',
        cityId:'101',
        description:''
      }
    })
  </script>
</body>
</html>
