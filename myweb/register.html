<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>个人注册</title>
    <link href="../myweb/register.css" rel="stylesheet">
</head>
<body>
<h1>Sign Up 注册</h1>
<form action="" class="registerlist">
    <h2>个人信息</h2>
    <label>&nbsp;姓名：</label><input placeholder="请输入真实姓名" required type="text"/><br/><br/>
    <label>&nbsp;密码：</label><input placeholder="请输入密码" required type="password"/><br/><br/>
    <label>确认密码：</label><input placeholder="请再次输入密码" required type="password"/><br/><br/>
    <label>性别: <input checked name="gender" type="radio"/>男&nbsp;&nbsp;</label>
    <label><input name="gender" type="radio"/>女</label><br/><br/>
    <label>居住城市：</label>
    <select required>
        <option disabled selected>--- 请选择城市 ---</option>
        <option>哈尔滨</option>
        <option>北京</option>
        <option>上海</option>
        <option>深圳</option>
        <option>广州</option>
        <option>重庆</option>
        <option>武汉</option>
    </select>
    <br/>
    <h2>教育经历</h2>
    <label>最高学历：</label>
    <select required>
        <option disabled selected>--- 请选择学历 ---</option>
        <option>博士</option>
        <option>硕士</option>
        <option>本科</option>
        <option>大专</option>
        <option>高中</option>
        <option>中专</option>
        <option>初中</option>
        <option>小学</option>
    </select><br><br>
    <label>毕业院校：</label><input placeholder="请输入毕业院校" required type="text"/><br/><br/>
    <label>专业：</label><input placeholder="请输入专业名称" required type="text"/><br/><br/>
    <label>在校时间：</label>
    <select required>
        <option disabled selected>--- 请选择年份 ---</option>
        <option>2016</option>
        <option>2017</option>
        <option>2018</option>
        <option>2019</option>
        <option>2020</option>
        <option>2021</option>
        <option>2022</option>
        <option>2023</option>
        <option>2024</option>
    </select>
    <label>年</label>
    <label>--</label>
    <select required>
        <option disabled selected>--- 请选择年份 ---</option>
        <option>2020</option>
        <option>2021</option>
        <option>2022</option>
        <option>2023</option>
        <option>2024</option>
        <option>2025</option>
        <option>2026</option>
        <option>2027</option>
        <option>2028</option>
    </select>
    <label>年</label>
    <br/>
    <h2>工作经历</h2>
    <label>公司名称：</label><input placeholder="请输入公司名称" required type="text"/><br/><br/>
    <label>工作经历：</label><br>
    <textarea class="workdescribe" placeholder="请输入内容" required></textarea><br><br>
    <input required type="checkbox"><label>已阅读并同意以下协议：</label>
    <ul>
        <li><a href="#">《用户服务协议》</a></li>
        <li><a href="#">《隐私政策》</a></li>
    </ul>
    <br>
    <button type="submit">免费注册</button>
    <button type="reset">重新填写</button>
</form>
</body>
</html>
