<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表单学习</title>
    <style>
      a {
        text-decoration: none;
        color: #0b0b0b;
      }
      a:hover {
        color: #0659e7;
      }
      .commentarea {
        resize:none;
        width: 500px;
        height:200px;
        margin-top: 10px;
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body>
    <form>
      <span>用户名：</span>
      <input type="text" placeholder="邮箱/手机号码/小米ID" />
      <br /><br />
      <span>&nbsp;密码：&nbsp;&nbsp;</span>
      <input type="password" placeholder="请输入密码" />
      <br /><br />
      <!-- label标签 -->
      <span>&nbsp;性别: &nbsp;&nbsp;</span>
      <input type="radio" name="gender" id="man" checked /><label for="man"
        >男</label
      >
      <label><input type="radio" name="gender" id="man" />女</label>
      <br /><br />
      <input type="checkbox" checked />我同意<a href="#"><ins>注册条款</ins></a
      ><br /><br />
      <span>编程语言：</span>
      <input type="checkbox" />C/C++ <input type="checkbox" checked />JAVA
      <input type="checkbox" checked />HTML/CSS/JS/VUE/REACT <br /><br />
      <span>上传文件：</span>
      <input type="file" multiple /><br /><br />
      <!-- 下拉菜单 -->
      <span>&lt;城市&gt;&nbsp;&nbsp;</span>
      <select>
        <option disabled selected>请选择城市</option>
        <option selected>哈尔滨</option>
        <option>北京</option>
        <option>上海</option>
        <option>深圳</option>
        <option>广州</option>
        <option>重庆</option>
        <option>武汉</option>
      </select>
    </form>
    <br />
    <!-- 按钮 -->
    <button type="submit">提交</button>
    <button type="reset">重置</button>
    <button type="button">保存</button>
    <hr />
    <!-- 文本域 -->
    <span>评论区</span><br />
    <textarea placeholder="请输入评论" class="commentarea"></textarea>
    <br />
    <!-- 布局标签 -->
    <!-- div标签：“大盒子” 换行 -->
    <!-- span标签：“小盒子” 不换行-->
    <!-- 字符实体 -->
    <!-- &lt; 等于 < -->
    <!-- &gt; 等于 > -->
    <!-- &nbsp; 等于 空格 -->
    <span
      >实体符号：&lt;&gt;&nbsp;&deg;&copy;&euro;&trade;&pound;&yen;&dollar;</span
    >
  </body>
</html>
