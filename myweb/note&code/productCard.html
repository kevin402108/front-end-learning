<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品卡片</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f1f1f1;
        }

        .productcard {
            margin: 47px auto;
            padding: 40px;
            width: 270px;
            height: 255px;
            background-color: #fff;
            text-align: center;
            h4 {
                margin-top: 20px;
                margin-bottom: 12px;
                color:#333;
                font-size: 18px;
                font-weight: normal;
            }
            p {
                font-size: 12px;
                color: #555;
            }
            border-radius: 10px ;
            
        }

        
    </style>
</head>
<body>
    <div class="productcard">
        <img src="../images/liveSDK.svg" alt="">
        <h4>抖音播放SDK</h4>
        <p>包含抖音直播看播功能</p>
    </div>
</body>
</html>
