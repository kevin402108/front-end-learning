<body>
<!--shortcut-->
<div class="shortcut">
    <div class="wrapper">
        <ul>
            <li><a href="#">请先登录</a></li>
            <li><a href="#">免费注册</a></li>
            <li><a href="#">我的订单</a></li>
            <li><a href="#">会员中心</a></li>

            <li><a href="#"><span class="iconfont icon-mobile-phone"></span>手机版</a></li>
        </ul>
    </div>
</div>
<!--header-->
<div class="header wrapper">
        <div class="logo">
            <!-- SEO -->
            <h1><a href="#">小兔鲜</a></h1>
        </div>
        <div class="nav">
            <ul>
                <li><a href="#">首页</a></li>
                <li><a href="#">生鲜</a></li>
                <li><a href="#">美食</a></li>

                <li><a href="#">孕婴</a></li>
                <li><a href="#">服装</a></li>
            </ul>
        </div>
        <script>
            (function() {
                const navLinks = document.querySelectorAll(".header .nav li a")
                document.querySelector('.header .nav').addEventListener("click", function(e) {
                    if (e.target.tagName === "A") {
                        e.preventDefault();
                        navLinks.forEach(link => {
                            if (link.classList.contains("nav-tabs-active")) {
                                link.classList.remove("nav-tabs-active")
                            }
                        })
                        e.target.classList.add("nav-tabs-active")
                    }
                })
            })()
        </script>
        <div class="search">
            <span class="iconfont icon-search"></span>
            <label><input type="text" placeholder="搜一搜"></label>
        </div>
        <div class="shop-cart">
            <a href="#" class="iconfont icon-cart-full"></a>
            <i>1</i>
        </div>
</div>
