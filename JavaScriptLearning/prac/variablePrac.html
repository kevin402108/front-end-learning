<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>变量练习</title>
</head>
<body>
    <script>
        //document.write()方法中换行可用</p>或</br>标签，不能用\n
        const PI=3.14;
        let radius=prompt('请输入圆的半径:');
        document.write('圆的半径：'+radius);
        let area=PI*(radius**2);
        document.write('</p>');
        document.write('圆的面积：'+area);
    </script>
</body>
</html>
