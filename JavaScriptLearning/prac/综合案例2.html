<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>综合案例2 --- 简易ATM取款机</title>
</head>
<body>
    <script>
      let tot_money=500;
      while(true){
        let op = prompt('请您选择操作:\n1.存钱\n2.取钱\n3.查看余额\n4.退出');
        if(op === '4') {
          break;
        }
        switch(op){
          case '1':
            let add_money=+prompt('请您输入存款的金额：');
            tot_money+=add_money;
            break;
          case '2':
            let take_money=+prompt('请您输入取款的金额：');
            if(tot_money<take_money){
              alert('余额不足！');
              break;
            }
            tot_money-=take_money;
            break;
          case '3':
            alert(`您卡上的余额为${tot_money}元`);
            break;
          default:
            alert('输入错误，请输入1、2、3、4中任意地一个数！');
            break;
        }
      }
    </script>
</body>
</html>
