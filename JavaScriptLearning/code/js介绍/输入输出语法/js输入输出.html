<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>js输入输出</title>
</head>
<body>
    <script>
    // 1.输出语法
        //document.write()
        document.write('<h1>Welcome to my web!</h1>')
        document.write('Hello world!')
        //alert()
        alert('欢迎访问网页！')
        //console.log() 控制台打印输出，不展示在网页上，方便调试
        console.log('网页加载成功！')
        console.log('logs ended!')
    // 2.输入语法 prompt()
        prompt('请输入您的年龄：')
        //alter()和prompt()会跳过页面渲染先被执行！！！
        //prompt()输入的内容默认为string类型
    </script>
</body>
</html>
