<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>面向对象封装消息提示</title>
  <style>
    .model {
      width: 300px;
      min-height: 100px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      position: fixed;
      z-index: 999;
      left: 50%;
      top: 50%;
      transform: translate3d(-50%, -50%, 0);
      background-color: #fff;
    }

    .model .header {
      line-height: 40px;
      padding: 0 10px;
      position: relative;
      font-size: 20px;
    }

    .model .header i {
      font-style: normal;
      color: #999;
      position: absolute;
      right: 15px;
      top: -2px;
      cursor: pointer;
    }

    .model .body {
      text-align: center;
      padding: 10px;
    }

    .model .footer {
      display: flex;
      justify-content: flex-end;
      padding: 10px;
    }

    .model .footer a {
      padding: 3px 8px;
      background: #ccc;
      text-decoration: none;
      color: #fff;
      border-radius: 2px;
      margin-right: 10px;
      font-size: 14px;
    }

    .model .footer a.submit {
      background-color: #369;
    }
  </style>
</head>

<body>
  <button id="delete">删除</button>
  <button id="login">登录</button>

<!--  <div class="model" style="display: none;">
    <div class="header"> <i>x</i></div>
    <div class="body"></div>
  </div>-->


  <script>
      function Model(title = '',msg = ''){
        this.title = title;
        this.msg = msg;
        this.modelBox = document.createElement('div');
        this.modelBox.className = 'model';
        this.modelBox.innerHTML = `
          <div class="header">${title}<i>x</i></div>
          <div class="body">${msg}</div>
        `;
      }

      // new model('温馨提示','你没有删除权限');
      Model.prototype.display = function (){
        if (!document.querySelector('.model')) {
          document.body.append(this.modelBox);
          this.modelBox.querySelector('i').addEventListener('click', ()=>{
              this.close();//箭头函数中的this指向该函数的上一级作用域，即外层函数的调用者model
          });
        }
      };

      Model.prototype.close = function (){
          this.modelBox.remove();
      }

      document.querySelector('#delete').addEventListener('click',function (){
        const model = new Model('温馨提示','您没有删除权限操作');
        model.display();
      });

      document.querySelector('#login').addEventListener('click',function (){
        const model = new Model('友情提示','您还么有注册账号');
        model.display();
      });
  </script>
</body>

</html>
