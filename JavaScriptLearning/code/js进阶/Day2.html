<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Day2</title>
</head>
<body>
<ul>
    <li>1</li>
    <li>2</li>
    <li>3</li>
</ul>
<script>
        //创建对象三种方式
        let obj = {
            name:'o'
        }
        obj = new Object({name:'o'});
        obj = ({name:'o'});

        //构造函数
        function Person(name,age,gender){
            this.name=name;
            this.age=age;
            this.gender=gender;
        }
        Person.weight = 100;
        Person.sleep = ()=>{
            console.log('睡觉！');
        }
        const me = new Person('kevinChan',20,'男');
        console.log(me);
        console.log(Person.weight);
        Person.sleep();

        //内置构造函数
        //Object
        //1.Object.keys()/Object.values
        const obj1 = {name:'name',age:18};
        console.log(Object.keys(obj1),Object.values(obj1));
        const oo = {};
        Object.assign(oo, obj1);
        Object.assign(oo, {gender:'男'});
        console.log(oo);

        //Array
        //实例方法：【forEach()/filter()/map()见前面课程的代码】
        //reduce()
        const o1 = [1,3,5];
        //无初始值
        let tot = o1.reduce((prev,cur)=>prev+cur);
        console.log(tot);
        //有初始值
        tot = o1.reduce((prev,cur)=>prev+cur,10);
        console.log(tot);

        const arr2 = [23,34,54,43,16,56,45,100,58]
        //静态方法
        //find(回调函数),返回符合要求的第一个值，未找到返回undefined
        let res = arr2.find(elem => elem >=10 && elem<100);
        console.log(res);

        //every():判所给定数组中每个元素是否符合条件，只要有一个不符合返回false，全部符合返回true
        res = arr2.every(elem => elem >= 10);
        console.log(res);

        //from():伪数组转化为真数组
        const lis = document.querySelectorAll('ul li');
        const liss = Array.from(lis);
        console.log(liss.pop());

        //String
        const str = 'pink,red,blue';

        //split() 括号内为分隔符，将字符串转换为数组,与join()相反
        const arr = str.split(',');
        console.log(arr);

        //substring()
        res = str.substring(0,4);
        console.log(res);

        //startsWith()/endsWith()/includes()
        res = str.startsWith('pink');
        console.log(res);
        res = str.endsWith('blue',str.length);
        console.log(res);
        res = str.includes('pink');
        console.log(res);

        //toFixed(n) 保留n位小数,不写默认对小数进行四舍五入

        //String()/toString() 转化为字符串
        const num = 100;
        console.log(String(num));
        console.log(num.toString());
    </script>
</body>
</html>
