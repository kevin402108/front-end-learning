<body>
    <script>
        Array.prototype.sum = function(){
            return this.reduce((prev,cur) => prev+cur ,0);
        };

        Array.prototype.max = function (){
           return Math.max(...this);
        };

        Array.prototype.min= function (){
            return Math.min(...this);
        };

        const arr = [1,3,5];
        console.log(arr.sum());
        console.log(arr.max());
        console.log(arr.min());
    </script>
</body>
</html>
