<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Day2 Prac</title>
</head>
<body>
    <div></div>
    <p></p>
    <script>
        function Goods(name,price,count) {
            this.name=name;
            this.price=price;
            this.count=count;
        }
        const xiaomi = new Goods('小米',1999,20);
        const huawei = new Goods('华为',3999,59);
        const vivo = new Goods('vivo',1888,10);
        console.log(xiaomi,huawei,vivo);

        const arr = [{
            name: '张三',
            salary: 10000
        }, {
            name: '李四',
            salary: 10000
        }, {
            name: '王五',
            salary: 10000
        },
        ];
        //涨薪30%，计算需支付薪水
        let tot = arr.map(elem => elem.salary).reduce((prev,cur)=>prev+cur*1.3,0);
        console.log(tot);

        const spec = {size:'40cm*40cm',color:'黑色'};
        //用values方法将所有的值转化为一个数组，然后在用join方法将数组转化为字符串
        document.querySelector('div').innerHTML = Object.values(spec).join('/');

        const gift = '50g茶叶,清洗球';
        //将字符串用split()形成数组,用map()对数组里的内容转化html文本,最后再用join方法把数组转化为字符串并添加到相应标签内部
        document.querySelector('p').innerHTML = gift.split(',').map(elem => `<span class="tag">【赠品】${elem}</span>`).join('<br>');
    </script>
</body>
</html>
