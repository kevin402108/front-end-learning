<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Day3</title>
</head>
<body>
    <script>
        //原型对象 prototype
        function Person(uname,age,gender) {
            this.uname=uname;
            this.age=age;
            this.gender=gender;
        }
        Person.prototype.sing = ()=>console.log('唱歌');
        Person.prototype.dance = ()=>console.log('跳舞');
        const me = new Person('KEVIN CHAN',20,'男');
        const person = new Person('张三',21,'男');
        me.sing();

        //constructor 属性
        Person.prototype = {
            constructor:Person,
            sing:()=>console.log('唱歌'),
            dance:()=>console.log('跳舞')
        };
        console.log(Person.prototype);

        //对象原型 指向 构造函数的原型对象
        console.log(me.__proto__);

        //原型继承
        function Man(){

        }
        Man.prototype = new Person();
        Man.prototype.constructor = Man;
        const pink = new Man();
        console.log(pink);
        console.log(Man.prototype);

        function Woman(){

        }
        Woman.prototype = new Person();
        Woman.prototype.constructor = Woman;
        Woman.prototype.baby = function (){
            console.log('生小孩');
        }
        const red = new Woman();
        console.log(red);
        console.log(Woman.prototype);

        console.log(Person.prototype.__proto__);

        //instanceof 运算符:判断某对象是否在当前实例对象的原型链上
        console.log(red instanceof Woman);
        console.log(red instanceof Person);
        console.log(red instanceof Object);
    </script>
</body>
</html>
