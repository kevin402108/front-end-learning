<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>内置对象</title>
</head>
<body>
    <script>
        //Math内置对象
        //属性
        console.log(Math.PI);
        console.log(Math.E);
        //方法
        // 向上取整 ceil()
        console.log(Math.ceil(2.6));
        console.log(Math.ceil(-2.6));
        //向下取整 floor()
        console.log(Math.floor(2.6));
        console.log(Math.floor(-2.6));
        //四舍五入 round()
        console.log(Math.round(1.3));
        console.log(Math.round(-1.3));
        console.log(Math.round(1.5));
        console.log(Math.round(-1.5));
        //最大值 max()
        console.log(Math.max(2,325435,34534,213,325,7,45,23234,453));
        //最小值 min()
        console.log(Math.min(2,325435,34534,213,325,7,45,23234,453));
        //求幂 pow()
        console.log(Math.pow(-2,3));
        //平方根 sqrt()
        console.log(Math.sqrt(4.5));
        //立方根 cbrt()
        console.log(Math.cbrt(4.5));

        //随机数 random()
        console.log(Math.random());
        //0-10之间的随机整数
        console.log(Math.floor(Math.random()*(10+1)));
        //5-10之间的随机整数
        console.log(Math.floor(5+Math.random()*(10-5+1)));
        //N-M之间的随机整数 N+Math.floor(Math.random()*(M-N+1))
        function getRandom(N,M){
            return N+Math.floor(Math.random()*(M-N+1));
        }

        console.log(getRandom(-5146,61665));
        //应用
        let arr=[1,3,5,7,9];
        let index=Math.floor(Math.random()*arr.length);
        console.log(arr[index]);
    </script>
</body>
</html>
