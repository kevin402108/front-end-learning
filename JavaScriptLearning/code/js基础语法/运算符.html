<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>运算符</title>
</head>
<body>
<script>
//赋值运算符 = += -= *= /= %=
//一元运算符 ++
//比较运算符 > < >= <= == === !==
    console.log(3 > 5);
    console.log(3 >= 5);
    console.log(3 < 5);
    console.log(3 <= 5);
    // == 判断两边值是否相同(若一端为数值类型，另一端的字符串只包含数字，则会将该数值字符串隐式转换为数值类型再进行比较，不建议使用！！！)
    console.log(2 == '2');
    // === 判断两端类型和值是否都相同（开发中较实用）
    console.log(2 === '2');
    // != 判断两端值是否不同，判断方法与==相同
    console.log(2 != '2');
    // !== 判断两端类型和值是否不同，有一者不同即为false
    console.log(2 !== '2');
    //字符串之间比较的是ASCII码值大小
    //NaN不等于任何值（包括NaN）
//逻辑运算符 && || ！
</script>
</body>
</html>
