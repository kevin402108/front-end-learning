<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>变量</title>
</head>
<body>
<script>
// 声明变量:let 变量名
    let name='Kevin Chan';
    let gender='男';
    let age=20;
    document.write('姓名：'+name+'</br>性别：'+gender+'</br>年龄：'+age);
    //交换数字
    let num1=10,num2=20,tmp;
    document.write('</br>交换前：'+num1+' '+num2);
    tmp=num1;
    num1=num2;
    num2=tmp;
    console.log('</br>交换后：'+num1+' '+num2);
// 声明及使用数组 let 变量名 = []
    let num_arr=[10,20,30];
    console.log(num_arr[0]);
    let days=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
    console.log(days.length);
    console.log(days[6]);
//声明常量 const
    const MAXSIZE = 100;
    console.log(MAXSIZE);
//数据类型
     //typeof 获取数据类型
     //数值类型
    let score=100;
    document.write('</br>'+score);
    document.write(' '+typeof score)
     //字符串
    let str1="pink";
    let str2='pink\'粉色\'';
    let str3=`pink`;
    let str4='';
      //模板字符串 ${} 必须用反引号包围
    document.write(`</br>${str1} ${str2} ${str3} ${str4}</br>`);
    document.write(`${typeof str1} ${typeof str2} ${typeof str3} ${typeof str4}`);
     //布尔类型
    let isFull=false;
    document.write(`</br>${typeof isFull}`);
    document.write('</br>'+isFull);
    isFull=true;
    document.write(`</br>${isFull}`);
     //undefined
    let temp;
    document.write(`</br>${typeof temp}`)
     //null 将null赋给一个变量，则该变量类型为object
    let obj=null;
    document.write(`</br>obj的类型：${typeof obj}`);
//类型转换
    //隐式转换
    let num3=13,num4=(+'2');
    document.write(`</br>num3+num4=${num3+num4} 类型：${typeof (num3+num4)}`);
    document.write(`</br>num3-num4=${num3-num4} 类型：${typeof (num3-num4)}`);
    //显示转换
     //转化为数值类型
    let a=Number(prompt('请输入一个数'));
    let b=+(prompt('请输入一个数'));//在数值字符串前添上加号可转化为数值类型
    let c=parseInt('23.5');//如果为数值字符串，并且只保留整数部分
    let d=parseFloat('23.5')//如果为数值字符串，即使是小数，也可保持小数形式
    alert(`result：${a+b} ${c} ${d}`);

</script>
</body>
</html>
