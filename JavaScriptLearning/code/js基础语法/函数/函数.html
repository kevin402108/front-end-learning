<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>函数</title>
</head>
<body>
<script>
    //函数声明
    function sayHello() {
        alert('Hello World!');
    }

    //函数使用
    /*sayHello();*/

    //函数传参 function 函数名(参数1 [= ...],参数2 [= ...],...) {}
    //函数返回值 return ...
    function getSum(start = 0, end = 0) {
        let sum = 0;
        if (start > end) {
            let temp = start;
            start = end;
            end = temp;
        }
        for (let i = start; i <= end; i++) {
            sum += i;
        }
        return sum;
    }

    /*let num1 = +prompt('请输入起始值：');
    let num2 = +prompt('请输入结束值：');
    let res1 = getSum(-5525, 10000);
    console.log(res1);
    res1 = getSum(num1, num2);
    console.log(res1);
    res1 = getSum();
    console.log(res1);*/

    //返回多个值
    function getPoleValue(arr = []) {
        if (arr[0] !== undefined) {
            let max = arr[0], min = arr[0];
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] > max) {
                    max = arr[i];
                }
                if (arr[i] < min) {
                    min = arr[i];
                }
            }
            return [max, min];
        } else {
            alert('数组为空 或 参数不匹配！');
        }
    }

    let arr = [23, 235435, 345, 123, 3454];
    let res = getPoleValue(arr);
    if (res !== undefined) {
        let maximum = res[0];
        let minimum = res[1];
        console.log(`最大值：${maximum}`);
        console.log(`最小值：${minimum}`);
    } else {
        alert('无法获取到最大值或最小值！');
    }

    //作用域 全局作用域 --- 全局变量   局部作用域 --- 局部变量
    //变量访问遵循就近原则

    //匿名函数
    //1.函数表达式(必须声明后调用！！！)
    let fn = function () {
        console.log('我是函数表达式！');
    }
    fn();

    //2.立即执行函数
    //第一种写法
    (function () {
        let num = 20;
        console.log(num);
    })();

    (function (x = 0, y = 0) {
        let num = 30;
        x += num;
        console.log(x + y);
    })(2, 3);

    //第二种写法
    (function (x, y) {
        console.log(x + y);
    }(1, 3));

    //逻辑中断
    function fn1(x, y) {
        x = x || 0;
        y = y || 0;
        console.log(x + y);
    }

    fn1();

    (function flexible(window, document) {
        let dpr = window.devicePixelRatio || 1;
    })(window, document);

    //转为布尔类型
    // &&
    /*将两侧转换为boolean类型后，只要左侧为假，返回左侧的值。若左侧为真，右侧无论真假均返回右侧的值*/
    console.log(20 && 30);
    console.log(20 && undefined);
    console.log(NaN && 30);
    console.log(NaN && false);
    // ||
    /*将两侧转换为boolean类型后，只要左侧为真，返回左侧的值。若左侧为假，右侧无论真假均返回右侧的值*/
    console.log(20 || 30);
    console.log(20 || false);
    console.log(NaN || 30);
    console.log(NaN || false);
    //隐式转换
    //空字符串（''）"+"：字符串拼接、"-"：---（数字转换）--> 0
    console.log('' + 7);
    console.log('' - 7);
    //null --（数字转换）--> 0
    console.log(null + 1.5);
    //undefined,NaN --（数字转换）--> NaN
    console.log(undefined + 2);
    console.log(NaN + 3);
</script>
</body>
</html>
