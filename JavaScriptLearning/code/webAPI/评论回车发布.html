<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评论回车发布</title>
    <script src="../../tools.js"></script>
    <style>
        .wrapper {
            min-width: 400px;
            max-width: 800px;
            display: flex;
            justify-content: flex-end;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            background: url(./images/avatar.jpg) no-repeat center / cover;
            margin-right: 20px;
        }

        .wrapper textarea {
            outline: none;
            border-color: transparent;
            resize: none;
            background: #f5f5f5;
            border-radius: 4px;
            flex: 1;
            padding: 10px;
            transition: all 0.5s;
            height: 30px;
        }

        .wrapper textarea:focus {
            border-color: #e4e4e4;
            background: #fff;
            height: 50px;
        }

        .wrapper button {
            background: #00aeec;
            color: #fff;
            border: none;
            border-radius: 4px;
            margin-left: 10px;
            width: 70px;
            cursor: pointer;
        }

        .wrapper .total {
            margin-right: 80px;
            color: #999;
            margin-top: 5px;
            opacity: 0;
            transition: all 0.5s;
        }

        .list {
            min-width: 400px;
            max-width: 800px;
            display: block;
        }

        .list .item {
            width: 100%;
            display: flex;
        }

        .list .item .info {
            flex: 1;
            border-bottom: 1px dashed #e4e4e4;
            padding-bottom: 10px;
        }

        .list .item p {
            margin: 0;
        }

        .list .item .name {
            color: #FB7299;
            font-size: 14px;
            font-weight: bold;
        }

        .list .item .text {
            color: #333;
            padding: 10px 0;
        }

        .list .item .time {
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>
<div class="wrapper">
    <i class="avatar"></i>
    <textarea id="tx" placeholder="发一条友善的评论" rows="2" maxlength="300"></textarea>
    <button>发布</button>
</div>
<div class="wrapper">
    <span class="total"></span>
</div>
<div class="list"></div>
<script>
    const commentArea = document.querySelector('#tx');
    const totalSpan = document.querySelector('.total');
    const sendBtn = document.querySelector('button');
    const item = document.querySelector('.item');
    commentArea.addEventListener('blur', function () {
        totalSpan.style.opacity = '0';
    });

    commentArea.addEventListener('focus', function () {
        totalSpan.style.opacity = '1';
    });

    commentArea.addEventListener('input', function () {
        totalSpan.innerHTML = `${commentArea.value.length}/${commentArea.maxLength}字`
    });

    //事件绑定的回调函数的第一个参数为事件对象
    commentArea.addEventListener('keyup', function (event) {
        if (event.key === 'Enter') {
            sendComment();
        }
    });

    sendBtn.addEventListener('click', function () {
        sendComment();
    });

    function showComment() {
        const commentLists = document.querySelector('.list');
        const newComment = document.createElement('div');
        newComment.classList.add('item');
        newComment.innerHTML = `
            <i class="avatar"></i>
            <div class="info">
                <p class="name">SOUTHERNER</p>
                <p class="text">${commentArea.value}</p>
                <p class="time">${getSystemTime()}</p>
            </div>
        `;
        if (commentLists.children) {
            commentLists.insertBefore(newComment,commentLists.children[0]);
        } else {
            commentLists.appendChild(newComment);
        }
    }

    function sendComment() {
        //trim() 去除左右多于空格
        if (commentArea.value.trim()) {
            showComment();
        } else{
            alert('输入不能为空！');
        }
        commentArea.value = '';
        totalSpan.innerHTML = `0/${commentArea.maxLength}字`;
    }
</script>
</body>

</html>
