<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>轮播图点击切换</title>
    <script src="../../../tools.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        .slider {
            width: 560px;
            height: 400px;
            overflow: hidden;
        }

        .slider-wrapper {
            width: 100%;
            height: 320px;
        }

        .slider-wrapper img {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
        }

        .slider-footer {
            height: 80px;
            background-color: rgb(100, 67, 68);
            padding: 12px 12px 0 12px;
            position: relative;
        }

        .slider-footer .toggle {
            position: absolute;
            right: 0;
            top: 12px;
            display: flex;
        }

        .slider-footer .toggle button {
            margin-right: 12px;
            width: 28px;
            height: 28px;
            appearance: none;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }

        .slider-footer .toggle button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .slider-footer p {
            margin: 0;
            color: #fff;
            font-size: 18px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .slider-indicator {
            margin: 0;
            padding: 0;
            list-style: none;
            display: flex;
            align-items: center;
        }

        .slider-indicator li {
            width: 8px;
            height: 8px;
            margin: 4px;
            border-radius: 50%;
            background: #fff;
            opacity: 0.4;
            cursor: pointer;
        }

        .slider-indicator li.active {
            width: 12px;
            height: 12px;
            opacity: 1;
        }
    </style>
</head>

<body>
<div class="slider">
    <div class="slider-wrapper">
        <img src="../images/slider01.jpg" alt=""/>
    </div>
    <div class="slider-footer">
        <p>对人类来说会不会太超前了？</p>
        <ul class="slider-indicator">
            <li class="active" data-id="0"></li>
            <li data-id="1"></li>
            <li data-id="2"></li>
            <li data-id="3"></li>
            <li data-id="4"></li>
            <li data-id="5"></li>
            <li data-id="6"></li>
            <li data-id="7"></li>
        </ul>
        <div class="toggle">
            <button class="prev">&lt;</button>
            <button class="next">&gt;</button>
        </div>
    </div>
</div>
<script>
    // 1. 初始数据
    const sliderData = [
        {url: '../images/slider01.jpg', title: '2022明星陪你过大年', color: 'rgb(100, 67, 68)'},
        {url: '../images/slider02.jpg', title: '开启剑与雪的黑暗传说！', color: 'rgb(43, 35, 26)'},
        {url: '../images/slider03.jpg', title: '游戏策划“缝”的游戏究竟如何呢？', color: 'rgb(36, 31, 33)'},
        {url: '../images/slider04.jpg', title: '真正的jo厨出现了！', color: 'rgb(139, 98, 66)'},
        {url: '../images/slider05.jpg', title: '李玉刚：让世界通过B站看到东方大国文化', color: 'rgb(67, 90, 92)'},
        {url: '../images/slider06.jpg', title: '快来分享你的寒假日常吧~', color: 'rgb(166, 131, 143)'},
        {url: '../images/slider07.jpg', title: '哔哩哔哩小年YEAH', color: 'rgb(53, 29, 25)'},
        {url: '../images/slider08.jpg', title: '一站式解决你的电脑配置问题！！！', color: 'rgb(99, 72, 114)'},
    ]

    let index = 0;
    const sliderImg = document.querySelector('.slider-wrapper img');
    const footer = document.querySelector('.slider-footer');
    const title = document.querySelector('.slider-footer p');
    const li = document.querySelectorAll(`.slider-indicator li`);
    const preBtn = document.querySelector(`.slider-footer .prev`);
    const nextBtn = document.querySelector(`.slider-footer .next`);

    //用于轮播图的定时器
    let timerID = setInterval(function () {
        nextBtn.click();
    }, 3000);

    sliderImg.addEventListener('mouseenter', function () {
        clearInterval(timerID);
    });

    sliderImg.addEventListener('mouseleave', function () {
        clearInterval(timerID);
        timerID = setInterval(function () {
            nextBtn.click();
        }, 3000);
    });

    preBtn.addEventListener('click', function () {
        document.querySelector('.slider-indicator .active').classList.remove('active');
        index--;
        if (index <= 0) {
            index = sliderData.length - 1;
        }
        sliderImg.src = sliderData[index].url;
        footer.style.backgroundColor = sliderData[index].color;
        title.innerHTML = sliderData[index].title;
        li[index].classList.add('active');
    })

    nextBtn.addEventListener('click', function () {
        document.querySelector('.slider-indicator .active').classList.remove('active');
        index++;
        if (index >= sliderData.length) {
            index = 0;
        }
        sliderImg.src = sliderData[index].url;
        footer.style.backgroundColor = sliderData[index].color;
        title.innerHTML = sliderData[index].title;
        li[index].classList.add('active');
    })

    /*for (let i = 0; i < li.length; i++) {
            li[i].addEventListener('click',function (){
            clearInterval(timerID);
            index = i;
            document.querySelector('.slider-footer .slider-indicator .active').classList.remove('active');
            this.classList.add('active');
            sliderImg.src = sliderData[i].url;
            footer.style.backgroundColor = sliderData[i].color;
            title.innerHTML = sliderData[i].title;
            timerID = setInterval(function (){
                nextBtn.click();
            },3000);
        });
    }*/

    const indicator = document.querySelector('.slider-indicator');
    indicator.addEventListener('click', function (event) {
        if (event.target.tagName === 'LI') {
            clearInterval(timerID);
            document.querySelector('.slider-indicator .active').classList.remove('active');
            event.target.classList.add('active');
            const ind = +(event.target.dataset.id);
            //将index调整至当前小圆点所在的索引，确保轮播图从当前索引往后自动播放
            index = ind;
            sliderImg.src=sliderData[ind].url;
            title.innerHTML=sliderData[ind].title;
            footer.style.backgroundColor=sliderData[ind].color;
            timerID = setInterval(function (){
                nextBtn.click();
            },3000);
        }
    });

</script>
</body>

</html>
