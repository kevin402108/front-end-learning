<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>倒计时</title>
    <script src="../../tools.js"></script>
    <style>
        .countdown {
            width: 240px;
            height: 305px;
            line-height:1;
            color: #ffffff;
            text-align: center;
            background-color: #ea067e;
            overflow: hidden;

            .today {
                margin-top: 25px;
                margin-bottom: 14px;
                font-size: 16px;
            }

            .title {
                font-size: 33px;
            }

            .clock {
                display: flex;
                margin: 0 auto;
                width: 142px;

                span,i {
                    display: block;
                    font-size: 23px;
                    line-height: 34px;
                    text-align: center;
                }

                span {
                    width: 34px;
                    height: 34px;
                    border-radius: 2px;
                    background-color: #303430;
                }

                i {
                    width: 20px;
                    font-style: normal;
                }
            }

            .tip {
                margin-top: 80px;
                font-size: 23px;
            }
        }
    </style>
</head>
<body>
    <div class="countdown">
        <p class="today">今天是2025年1月15日</p>
        <p class="title">倒计时</p>
        <p class="clock">
            <span id="hour">00</span>
            <i>:</i>
            <span id="min">00</span>
            <i>:</i>
            <span id="sec">00</span>
        </p>
        <p class="tip">18:30:00下课</p>
    </div>
    <script>
        const curTime =new Date();
        const year = curTime.getFullYear();
        const month = curTime.getMonth()+1;
        const date = curTime.getDate();
        const dateArea = document.querySelector('.countdown .today');
        dateArea.innerHTML= `今天是${year}年${month}月${date}日`;
        const countDownTime = document.querySelector('.countdown .clock');

        let timerID;
        const isValid = getRestTime();
        if (isValid){timerID=setInterval(getRestTime,1000);}
        function getRestTime() {
            let flag=true;
            const targetTime = +new Date('2025-1-15 23:59:59');
            const interval = (targetTime-(+new Date()))/1000;
            let hour=parseInt(interval/60/60);
            let min=parseInt(interval/60%60);
            let sec=parseInt(interval%60);
            if (hour <= 0){
                clearInterval(timerID);
                hour='00';
                min='00';
                sec = '00';
                flag=false;

            } else {
                hour = hour >= 10 ? ''+hour : '0' + hour;
                min = min >= 10 ? ''+min : '0' + min;
                sec = sec >= 10 ? ''+sec : '0' + sec;
            }
            document.querySelector('#hour').innerHTML = hour;
            document.querySelector('#min').innerHTML = min;
            document.querySelector('#sec').innerHTML = sec;
            return flag;
        }

        //页面刷新更换颜色
        const clock = document.querySelector('.countdown');
        clock.style.backgroundColor=getRandomColor();
    </script>
</body>
</html>
