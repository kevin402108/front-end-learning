<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/html" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>DOM</title>
    <script src="../../../tools.js"></script>
    <style>
        body {
            /*background: url(./images/desktop_1.jpg) no-repeat top center / cover fixed;*/
        }

        .v_box {
            /*为js调整样式使用*/
            margin: 50px 25%;
            padding: 0;
            width: 500px;
            height: 400px;
            border: 10px solid #999999;
        }

        .v_box_2 {
            box-shadow: 20px 10px 20px #999999;
        }
    </style>
</head>
<body>
<div class="ad">123</div>
<p id="nav">导航栏</p>
<ul class="test">
    <li>测试1</li>
    <li>测试2</li>
    <li>测试3</li>
</ul>
<img src="../images/1.webp" alt="" title="刘德华">
<label>密码：<input type="text" id="uname" placeholder="请输入用户名"></label><br>
<label><input type="checkbox" id="agreement_check">勾选表明您已阅读并同意<a href="#">xxx协议</a></label><br>
<button type="button" style="margin-left: 50px;margin-right: 10px;" id="submit">已阅读用户协议</button>
<button type="reset" id="reset">重置</button>

<script>
    //获取第一个元素 document.querySelector()
    // 返回第一个html对象
    const box = document.querySelector('.ad');
    console.log(box);
    const nav = document.querySelector('#nav');
    nav.style.color = 'red';
    // console.log(nav);
    const li = document.querySelector('.test li:nth-child(1)');
    console.log(li);
    //获取匹配的多个元素 document.querySelectorAll()
    // 返回匹配的NodeList对象集合,是伪数组，使用时只能用下表访问某个元素或遍历得到每一个元素
    const lis = document.querySelectorAll('.test li');
    console.log(lis);
    for (let i = 0; i < lis.length; i++) {
        console.log(lis[i]);
        lis[i].style.color = getRandomColor(true);
    }
    //操作元素内容
    //1.innerText属性 只显示文本，不解析标签
    console.log(box.innerText);
    box.innerText = 'Kevin Chan';
    //2.innerHTML属性 在可显示文本的基础上，也可解析标签
    console.log(box.innerHTML);
    box.innerHTML = '<strong>Author</strong>:Kevin Chan';

    //操作元素属性
    //1.常用对象属性 对象名.对象属性 = '...'
    const pic = document.querySelector('img');
    let index = getRandom(1, 6);
    pic.src = `./images/${index}.webp`;

    //2.样式属性
    // i.对象名.style.样式属性名 = '...'
    pic.style.width = '500px';
    pic.style.height = '300px';
    pic.style.border = '2px solid #999';
    index = getRandom(1, 10);
    /*body标签可直接通过document.body获取*/
    // document.body.style.backgroundImage=`url(./images/desktop_${index}.jpg)`;

    //ii.通过类名修改样式(在css中写好要修改的样式，然后将类名赋值给要修改的元素)
    pic.className = "v_box";//会覆盖已有类名

    //iii.通过classList修改样式 元素.classList.add()[增加]/remove()[删除]/toggle()[切换]
    pic.classList.remove('v_box');
    pic.classList.add('v_box_2');
    pic.classList.toggle('v_box'); //有就删掉，没有就加上

    //3.表单元素属性
    //文本框、密码框
    const uname = document.querySelector('#uname');
    uname.value = 'Kevin042108';
    console.log(uname.value);
    uname.type = 'password';

    //复选框
    const agreement_checkbox = document.querySelector('#agreement_check');
    agreement_checkbox.checked = true;

    //按钮
    const submit = document.querySelector('#submit');
    submit.disabled = false;

    //4.自定义属性 以 data- 开头
    console.log(pic.dataset);
    pic.dataset.figure_name = '刘德华';
    console.log(pic.dataset.figure_name);

    //定时器 --- 间歇函数 setInterval(函数,间隔时间(ms))
    let num = 10;
    //设置并开启定时器
    let timer=setInterval(function () {
        if (num === 0) {
            submit.innerHTML = `我同意该协议`;
            submit.disabled = false;
            clearInterval(timer); //关闭定时器
        } else {
            submit.innerHTML = `已阅读用户协议（${num}）`;
            submit.disabled = true;
            num--;
        }
    }, 1000);
</script>
</body>
</html>
