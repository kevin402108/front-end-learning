<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>DOM2 --- 事件</title>
    <script src="../../../tools.js"></script>
    <style>
        .box {
            width: 200px;
            height: 200px;
            background-color: #999;
        }

        .mousehover {
            background-color:pink;
            transform:translate(30px,30px) scale(1.3);
            box-shadow:10px 20px 10px #999;
            transition: all .5s ease;
        }

        .warning {
            margin-top: 5px;
            color: #000000;
        }
    </style>
</head>
<body>
    <button type="button" id="confirm">确认</button>
    <div class="box"></div>
    <label>用户名：<input type="text" id="uname"></label><br>
    <span class="warning" style="display: none;"></span>
    <script>
        //事件监听 元素对象.addEventListener('事件类型',执行函数)
        //事件源、事件类型、事件处理

        //事件类型
        //1.click
        const confirmBtn = document.querySelector('#confirm');
        confirmBtn.addEventListener('click',function (){
            alert('提交成功！');
        });

        //2.mouseenter/mouseleave
        const box = document.querySelector('.box');
        box.addEventListener('mouseenter',function (){
            box.classList.add('mousehover');
        });

        box.addEventListener('mouseleave',function () {
            box.classList.remove('mousehover');
        });

        //3.focus/blur 表单获得焦点/失去焦点
        const unameBox = document.querySelector('#uname');
        unameBox.addEventListener('focus',function (){
            unameBox.placeholder='请输入您的用户名';
        });

        unameBox.addEventListener('blur',function (){
            unameBox.placeholder='';
            warningText.style.display='none';
        });

        //4.keydown/keyup
        unameBox.addEventListener('keydown',function (){
            // console.log('键盘按下了');
        });

        unameBox.addEventListener('keyup',function (){
            // console.log('键盘弹起了');
        });

        //5.input
        const warningText = document.querySelector('.warning');
        unameBox.addEventListener('input',function () {
            const username = this.value;
            if (/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[$@!%*#?&._])[a-zA-Z\d$@!%*#?&._]{8,}$/
                .test(username)){
                warningText.innerHTML=`用户名 <strong>${unameBox.value}</strong> 可用`
                warningText.style.display='inline';
                warningText.style.color = 'green';
            } else {
                warningText.innerHTML='用户名至少包含8个字符，且至少有包含大写字母、小写字母、0-9、特殊字符($@!%*#?&._)'
                warningText.style.display='inline';
                warningText.style.color = 'red';
            }
        });

        //事件对象
         /*1.获取事件对象：事件绑定的回调函数（即addEventListener的第二个参数）的第一个参数为事件对象*/
        unameBox.addEventListener('keyup',function (event){
            if (event.key === 'Enter'){
                warningText.style.color = '#999';
                warningText.innerHTML=`您输入的用户名为 <span>${this.value}</span>`;
                const unameVal = document.querySelector('.warning span');
                unameVal.style.color = 'green';
            }
        });

        //环境对象 函数内部特殊变量this 指向函数调用者
        //直接调用函数，相当于window.函数

        //回调函数:如果函数A作为参数传递给参数B，则函数A为回调函数



    </script>
</body>
</html>
