<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>BOM---LocalStorage</title>
</head>
<body>
    <script>
        //本地存储
        //1.LocalStorage
        //增删改查 注意：本地存储只存储字符串，非字符串类型会转换为字符串
        localStorage.setItem('uname','kevinchan042108');
        let uname= localStorage.getItem('uname');
        console.log(uname);
        localStorage.removeItem('uname');
        localStorage.setItem('uname','red');
        localStorage.setItem('age',18);
        console.log(localStorage.getItem('age'));
        //2.SessionStorage 关闭当前页面窗口数据即消失,用法与LocalStorage类似

        //复杂数据类型存储 ps:复杂数据类型无法直接通过变量存储，必须转换为JSON对象才可
        const obj = {
            name:'kevinchan042108',
            pwd:'214365yt'
        }
        //将复杂数据类型通过JSON.stringify()转换为json对象字符串进行本地存储
        localStorage.setItem('obj',JSON.stringify(obj));
        //取出时再通过JSON.parse()变回来
        const res=JSON.parse(localStorage.getItem('obj'));
        console.log(res);
    </script>
</body>
</html>
